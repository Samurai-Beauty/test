<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Sans+JP:wght@300;400&display=swap">
  <style>
    body { margin: 0; }
    a { color: #d9c6cb; } a:hover { color: #fbfaf9; }
  </style>
</helmet>
<div style="width: 397px; height: 559px; background: #3a1b24; color: #f3ecee; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; display: flex; flex-direction: column; align-items: center; padding: 36px 30px 30px; box-sizing: border-box;">

  <img src="mark.png" alt="" style="height: 56px; width: auto; display: block;">
  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 18px; letter-spacing: 0.14em; margin-top: 12px;">IROHA D'ECOR</div>
  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 8px; letter-spacing: 0.36em; color: #a9919a; margin-top: 5px;">TOKYO</div>

  <div style="width: 46px; height: 1px; background: #6d505a; margin-top: 18px;"></div>
  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 27px; letter-spacing: 0.2em; margin-top: 16px; line-height: 1;">Wi-Fi</div>

  <div style="display: flex; gap: 16px; margin-top: 18px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="background: #fbfaf9; padding: 9px; border-radius: 2px;">
        <img src="qr5g.png" alt="IROHADECOR 5G の接続QRコード" style="width: 116px; height: 116px; display: block;">
      </div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 9px; letter-spacing: 0.16em; color: #a9919a;">5 GHz</div>
      <div style="font-size: 10px;">IROHADECOR 5G</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="background: #fbfaf9; padding: 9px; border-radius: 2px;">
        <img src="qr24g.png" alt="IROHADECOR 2.4G の接続QRコード" style="width: 116px; height: 116px; display: block;">
      </div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 9px; letter-spacing: 0.16em; color: #a9919a;">2.4 GHz</div>
      <div style="font-size: 10px;">IROHADECOR 2.4G</div>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 12px; margin-top: 24px;">
    <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 9px; letter-spacing: 0.2em; color: #a9919a;">PASSWORD</span>
    <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 27px; letter-spacing: 0.26em;">20120111</span>
  </div>

  <div style="font-size: 9px; line-height: 1.8; color: #a9919a; text-align: center; margin-top: auto;">
    カメラでQRコードを読み取ると接続できます
  </div>
</div>

</html>

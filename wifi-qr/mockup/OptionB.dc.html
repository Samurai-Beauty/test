<div style="width: 397px; height: 559px; background: #fbfaf9; color: #3a1b24; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; display: flex; flex-direction: column; align-items: center; padding: 32px 30px 26px; box-sizing: border-box;">

  <img src="mark.png" alt="" style="height: 50px; width: auto; display: block;">

  <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
    <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 9px; letter-spacing: 0.16em; color: #8e8085;">5 GHz</span>

  <div style="display: flex; align-items: baseline; gap: 12px; margin-top: auto;">
    <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 9px; letter-spacing: 0.2em; color: #8e8085;">PASSWORD</span>

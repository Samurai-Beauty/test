<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Sans+JP:wght@300;400&display=swap">
  <style>
    body { margin: 0; }
    a { color: #7a4a56; } a:hover { color: #3a1b24; }
  </style>
</helmet>
<div style="width: 397px; height: 559px; background: #fbfaf9; color: #3a1b24; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; display: flex; flex-direction: column; padding: 34px 32px 0; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <img src="mark.png" alt="" style="height: 42px; width: auto; display: block;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 15px; letter-spacing: 0.13em; line-height: 1;">IROHA D'ECOR</div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 7px; letter-spacing: 0.36em; color: #8e8085; line-height: 1;">TOKYO</div>
    </div>
  </div>

  <div style="width: 100%; height: 1px; background: #e4dcde; margin-top: 20px;"></div>

  <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 44px; letter-spacing: 0.06em; line-height: 1; margin-top: 22px;">Wi-Fi</div>
  <div style="font-size: 10px; letter-spacing: 0.08em; color: #8e8085; margin-top: 8px;">ご自由にお使いください</div>

  <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 24px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="qr5g.png" alt="IROHADECOR 5G の接続QRコード" style="width: 104px; height: 104px; display: block; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 10px; letter-spacing: 0.18em; color: #8e8085;">5 GHz</span>
        <span style="font-size: 13px;">IROHADECOR 5G</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <img src="qr24g.png" alt="IROHADECOR 2.4G の接続QRコード" style="width: 104px; height: 104px; display: block; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 10px; letter-spacing: 0.18em; color: #8e8085;">2.4 GHz</span>
        <span style="font-size: 13px;">IROHADECOR 2.4G</span>
      </div>
    </div>
  </div>

  <div style="margin: auto -32px 0; background: #3a1b24; color: #f3ecee; padding: 16px 32px; display: flex; align-items: baseline; gap: 12px;">
    <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 9px; letter-spacing: 0.2em; color: #a9919a;">PASSWORD</span>
    <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 27px; letter-spacing: 0.26em;">20120111</span>
  </div>
</div>
</x-dc>
</body>
</html>
